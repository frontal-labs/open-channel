[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "@openchannelprotocol/sdk"
version = "0.1.0"
description = "Python SDK for the OpenChannel Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Frontal Labs", email = "support@frontal.dev" },
]
maintainers = [
  { name = "Frontal Labs", email = "support@frontal.dev" },
]
keywords = ["@openchannelprotocol/protocol", "ocp", "agents", "ai", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/openchannelprotocol/open-channel#readme"
Repository = "https://github.com/openchannelprotocol/open-channel"
Issues = "https://github.com/openchannelprotocol/open-channel/issues"
Documentation = "https://github.com/openchannelprotocol/open-channel/tree/main/sdks/python"
Changelog = "https://github.com/openchannelprotocol/open-channel/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "build>=1.2.2,<2.0.0",
  "protobuf>=7.35.0",
  "ruff>=0.16.0,<0.17.0",
  "twine>=6.1.0,<7.0.0",
]
