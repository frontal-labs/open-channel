[package]
name = "ocp-sdk"
version = "2.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Rust SDK for the OpenChannel Protocol"
readme = "README.md"
authors = ["Frontal Labs <support@frontal.dev>"]
repository = "https://github.com/frontal-labs/open-channel"
homepage = "https://github.com/frontal-labs/open-channel#readme"
documentation = "https://docs.rs/ocp-sdk"
keywords = ["ocp", "agents", "communication", "protobuf", "ai"]
categories = ["api-bindings", "network-programming"]
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
prost-build = "0.14"

[package.metadata.docs.rs]
all-features = true
